name: Contract Conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    name: node conformance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install codegen dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Fetch contract bundle
        id: contract
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import json
          import pathlib

          manifest = json.loads(pathlib.Path("contract-manifest.json").read_text())
          print(manifest["contractVersion"])
          PY
          )"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          mkdir -p .contract "$RUNNER_TEMP/contract-bundle"
          # Public, tokenless distribution of the contract bundle (generated
          # contract surface only; source stays private in octomil-contracts).
          url="https://github.com/octomil/octomil-contract-bundles/releases/download/v${version}/contract-bundle-${version}.tar.gz"
          if curl -fsSL "$url" -o "$RUNNER_TEMP/contract-bundle/contract-bundle-${version}.tar.gz"; then
            expected="$(awk -v f="contract-bundle-${version}.tar.gz" '$2 == f { print $1 }' CONTRACT_BUNDLE_SHA256)"
            if [ -z "$expected" ]; then
              echo "::error::CONTRACT_BUNDLE_SHA256 has no entry for contract-bundle-${version}.tar.gz"
              exit 1
            fi
            echo "${expected}  $RUNNER_TEMP/contract-bundle/contract-bundle-${version}.tar.gz" | sha256sum -c -
            tar -xzf "$RUNNER_TEMP/contract-bundle/contract-bundle-${version}.tar.gz" \
              --strip-components=1 \
              -C .contract
            echo "source=bundle" >> "$GITHUB_OUTPUT"
          else
            echo "::error::contract-bundle-${version}.tar.gz is not published at ${url}"
            exit 1
          fi

      - name: Validate contract root
        env:
          EXPECTED_CONTRACT_VERSION: ${{ steps.contract.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import sys

          import yaml

          root = pathlib.Path(".contract")
          version = yaml.safe_load((root / "contract.yaml").read_text())["version"]
          expected = os.environ["EXPECTED_CONTRACT_VERSION"]
          if version != expected:
              print(f"::error::.contract version {version} != expected {expected}")
              sys.exit(1)
          for required in [
              "conformance",
              "generated/typescript",
              "scripts/generate_conformance.py",
              "scripts/sync_generated.py",
              "ci/audit-sdks.py",
              "ci/client_sdk_surface.yaml",
          ]:
              if not (root / required).exists():
                  print(f"::error::.contract is missing {required}")
                  sys.exit(1)
          print(f"Contract root ready from ${{ steps.contract.outputs.source }}: v{version}")
          PY

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install SDK dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated contracts
        run: python3 .contract/scripts/sync_generated.py --sdk node --check --target-dir src/_generated

      - name: Run conformance tests
        env:
          CONTRACT_ROOT: ${{ github.workspace }}/.contract
          CONTRACT_VERSION: ${{ steps.contract.outputs.version }}
        run: |
          pnpm vitest run tests/conformance/contract.test.ts --reporter=default
          python3 .contract/ci/audit-sdks.py --sdk node --sdk-path . --out parity_report.json

      - name: Gate parity score
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          report_path = pathlib.Path("parity_report.json")
          if not report_path.exists():
              print("::error::No parity report generated.")
              sys.exit(1)
          score = json.loads(report_path.read_text()).get("summary", {}).get("parityScore", 0)
          print(f"Parity score: {score}% (floor: 60%)")
          if float(score) < 60:
              print(f"::error::Parity score {score}% is below floor 60%")
              sys.exit(1)
          PY

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parity-node-${{ steps.contract.outputs.version }}
          path: parity_report.json
          retention-days: 90

  conformance-complete:
    name: Contract Conformance Complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - conformance
    if: always()
    permissions:
      contents: read
    steps:
      - name: Verify conformance succeeded
        run: |
          set -euo pipefail
          results='${{ toJSON(needs.*.result) }}'
          echo "Needed job results: ${results}"
          if echo "${results}" | grep -Eq '"(failure|cancelled|skipped)"'; then
            echo "::error::Contract conformance failed, was cancelled, or was skipped."
            exit 1
          fi
          echo "Contract conformance complete."
