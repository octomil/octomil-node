name: OpenAPI Types Fresh

# Drift gate for src/generated/types.ts. On every PR, regenerate from
# octomil-contracts dist/openapi.yaml using the same generator + exact
# version we'd use locally — then fail if the committed file differs.
#
# Pairs with octomil-contracts/tools/sdkgen/generate-typescript.sh.

on:
  # Run on every PR — drift can be introduced upstream (contracts SHA bump,
  # CONTRACTS_REF var change, auto-refresh PRs) with no local footprint
  # under src/generated/**. Mirrors Python's model.
  pull_request:
  push:
    branches: [main]

jobs:
  openapi-types-fresh:
    name: src/generated/types.ts matches contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout octomil-node
        uses: actions/checkout@v4

      - name: Checkout octomil-contracts (matching commit if PR pins one)
        uses: actions/checkout@v4
        with:
          repository: octomil/octomil-contracts
          path: .contracts-checkout
          # Default: latest main. To pin a specific contracts commit per
          # PR, push the SHA to the SPEC_COVERAGE_CONTRACTS_SHA repo var
          # or override here. See octomil-contracts PR #181 for the
          # snapshot-pinning pattern.
          ref: ${{ vars.CONTRACTS_REF || 'main' }}
          # Cross-repo checkout of a private repo — github.token cannot
          # read it. CROSS_REPO_READ_TOKEN must be a PAT (or fine-grained
          # token) with `contents: read` on octomil/octomil-contracts.
          # Falls back to github.token only for forks/public mirrors.
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Regenerate src/generated/types.ts
        env:
          OCTOMIL_NODE_PATH: ${{ github.workspace }}
          OCTOMIL_NODE: '1'
          OCTOMIL_BROWSER: '0'
          # Skip the per-script `pnpm add` step — frozen lockfile already
          # installed openapi-typescript at the pinned version.
          OCTOMIL_SKIP_INSTALL: '1'
        run: |
          chmod +x "$GITHUB_WORKSPACE/.contracts-checkout/tools/sdkgen/generate-typescript.sh"
          "$GITHUB_WORKSPACE/.contracts-checkout/tools/sdkgen/generate-typescript.sh"

      - name: Verify src/generated/types.ts is committed-fresh
        run: |
          if ! git diff --exit-code -- src/generated/types.ts; then
            echo "::error::src/generated/types.ts is stale relative to octomil-contracts dist/openapi.yaml"
            echo ""
            echo "Run locally to fix:"
            echo "    pnpm openapi:generate"
            echo "    git add src/generated/ && git commit"
            exit 1
          fi
          echo "✓ src/generated/types.ts matches the contract"

      - name: Fetch latest server openapi snapshot
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          SERVER_RUN=$(gh run list --repo octomil/octomil-server --workflow ci.yml \
                --branch main --status success --limit 1 --json databaseId,headSha \
                -q '.[0] | "\(.databaseId) \(.headSha)"')
          read -r RUN_ID SHA <<< "$SERVER_RUN"
          if [ -z "${RUN_ID:-}" ] || [ -z "${SHA:-}" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::Could not resolve a successful octomil-server ci.yml run. Check CROSS_REPO_READ_TOKEN actions:read access."
            exit 1
          fi
          mkdir -p .snapshot
          if ! gh run download "$RUN_ID" --repo octomil/octomil-server --name "openapi-snapshot-${SHA}" --dir .snapshot; then
            echo "::error::Could not download openapi-snapshot-${SHA} from octomil-server run ${RUN_ID}. Check artifact publication and CROSS_REPO_READ_TOKEN actions:read access."
            exit 1
          fi
          test -f .snapshot/openapi-snapshot.json
          echo "Fetched snapshot for SHA $SHA from server run $RUN_ID"
          ls -la .snapshot/

      - name: Strict spec->server gate (this SDK's contracts SHA has a real server route)
        run: |
          # Verify every contract method this SDK was generated against
          # has a real server route. Without this, the SDK could ship
          # clients for spec-only endpoints that 404 at runtime.
          cd .contracts-checkout
          python3 scripts/spec_coverage.py --strict --openapi-file "$GITHUB_WORKSPACE/.snapshot/openapi-snapshot.json" || {
            echo "::error::SDK was generated against a contracts SHA with documented-but-not-in-server methods."
            echo "Wait for octomil-server to ship matching endpoints, OR mark stray methods transport: local in contracts."
            exit 1
          }
